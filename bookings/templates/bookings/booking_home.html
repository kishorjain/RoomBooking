{% extends 'base.html' %}

{% block content %}

<div class="container" style="padding-top: 150px; margin-top: 100px !important;">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="mb-4">Room Reservation</h3>
            
            <form method="POST" action="{% url 'checkroom' %}">
                {% csrf_token %}
                {% if form.errors %}
                        <div class="alert alert-danger">
                            <strong>Please fix the errors below:</strong>
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}
                
                <!-- Room Category Row -->
                <div class="row mb-3 align-items-center">
                    <div class="col-sm-4">
                        <label for="roomType" class="form-label font-weight-bold text-dark mb-0">Select Room Category</label>
                    </div>
                    <div class="col-sm-8">
                        <select class="form-select custom-select w-100" id="roomType" name="room_category">
                            <option value="" selected>-- select room --</option>
                            {% for category in room_categories %}
                                <option value="{{ category.0 }}">{{ category.1 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Check-In Row -->
                <div class="row mb-3 align-items-center">
                    <div class="col-sm-4">
                        <label class="form-label mb-0">Check-In Time</label>
                    </div>
                    <div class="col-sm-8">
                        <input type="datetime-local" name="check_in" class="form-control date-picker" >
                    </div>
                </div>

                <!-- Check-Out Row -->
                <div class="row mb-3 align-items-center">
                    <div class="col-sm-4">
                        <label class="form-label mb-0">Check-Out Time</label>
                    </div>
                    <div class="col-sm-8">
                        <input type="datetime-local" name="check_out" class="form-control date-picker">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="row mt-4">
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
