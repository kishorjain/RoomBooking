{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container pt-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow p-4 border-0 rounded-4 bg-white text-center">
                <h3 class="font-weight-bold text-dark mb-3">Sign Out</h3>
                <p class="text-muted">Are you sure you want to sign out of your Palatin Room Booking account?</p>
                <hr>

                <form method="POST" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                    {% endif %}
                    
                    <button class="btn btn-danger w-100 py-2 btn-lg mb-2" type="submit">Confirm Sign Out</button>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100 py-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
