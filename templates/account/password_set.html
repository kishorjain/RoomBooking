{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container pt-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow p-4 border-0 rounded-4 bg-white">
                <h3 class="font-weight-bold text-dark mb-2 text-center">Set Password</h3>
                <p class="text-muted text-center mb-4">Create a master access password for your account.</p>
                <hr>

                <form method="POST" action="{% url 'account_set_password' %}" class="password_set">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <button class="btn btn-primary w-100 py-2 btn-lg" type="submit">Set Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
